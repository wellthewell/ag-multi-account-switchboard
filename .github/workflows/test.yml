name: Tests

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Compiles first, then runs the suite. Only test/unit runs here:
      # these must be hermetic, because the runner has no ~/.claude corpus
      # and no Antigravity state. Machine-coupled checks belong in
      # test/integration and are run locally.
      - name: Run tests
        run: npm test
